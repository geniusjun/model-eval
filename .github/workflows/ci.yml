name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm exec vitest run --project unit --project contract
      - name: Example swap check against the mock adapter (SC-001)
        timeout-minutes: 3
        run: pnpm exec vitest run --project e2e test/e2e/example-pogo.test.ts
      - name: End-to-end tests against the mock adapter
        timeout-minutes: 10
        run: pnpm exec vitest run --project e2e --exclude test/e2e/example-pogo.test.ts
      - run: pnpm check:coverage
      - name: SC-003 simulation
        run: pnpm bench
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - run: pnpm exec publint run "$RUNNER_TEMP"/pack/*.tgz
      # The package is ESM only, so CommonJS resolution is not checked.
      - run: pnpm exec attw "$RUNNER_TEMP"/pack/*.tgz --profile esm-only
