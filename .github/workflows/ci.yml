name: CI

# A pull request runs the helper contract tests on the lowest and the newest supported runtimes,
# each with one set of SDK releases. A push to main and a manual run (`gh workflow run ci.yml
# --ref <branch>`) run them with every pinned SDK release: every Python requirements file on
# both Pythons, and every Node SDK alias on Node 22 with the newest on Node 24 and 26.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the pull request's earlier run; every push to main and
# every manual run gets a run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 75 }}
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(github.event_name == 'pull_request' && '[22, 26]' || '[22, 24, 26]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          cache: pip
          cache-dependency-path: |
            adapters/python/tests/requirements/openai-2.txt
            adapters/python/tests/requirements/anthropic-2.txt
            examples/python-service/requirements.txt
      - run: pnpm install --frozen-lockfile
      # The Python of the mock API server, the Python adapters and the parity drivers.
      - name: Python environment with the openai 2 and anthropic 2 SDKs
        run: |
          python3 -m venv "$RUNNER_TEMP/helper-python"
          "$RUNNER_TEMP/helper-python/bin/python" -m pip install \
            -r adapters/python/tests/requirements/openai-2.txt \
            -r adapters/python/tests/requirements/anthropic-2.txt
          echo "MODEL_EVAL_PYTHON=$RUNNER_TEMP/helper-python/bin/python" >> "$GITHUB_ENV"
      # Checks that do not depend on the Node version run on Node 22 only.
      - if: matrix.node == 22
        run: pnpm typecheck
      - if: matrix.node == 22
        run: pnpm lint
      - if: matrix.node == 22
        run: pnpm format:check
      - run: pnpm build
      # Pull request: the first release of each Node SDK on Node 22, the newest major on Node 26.
      # Otherwise: every SDK alias on Node 22, the newest major on the other versions.
      - run: pnpm exec vitest run --project unit --project contract --project viewer
        env:
          MODEL_EVAL_NODE_SDKS: >-
            ${{ matrix.node != 22 && 'openai-7,anthropic-sdk-1'
            || github.event_name == 'pull_request' && 'openai-5-first,anthropic-sdk-0-first'
            || '' }}
      - name: Example swap check against the mock adapter (SC-001)
        timeout-minutes: 3
        run: pnpm exec vitest run --project e2e test/e2e/example-pogo.test.ts
      - name: Example Python service environment
        run: |
          cd examples/python-service
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Example Python service against the mock API server (003 SC-001, SC-004)
        timeout-minutes: 5
        run: pnpm exec vitest run --project example
      - name: End-to-end tests against the mock adapter
        timeout-minutes: 10
        run: pnpm exec vitest run --project e2e --exclude test/e2e/example-pogo.test.ts
      - if: matrix.node == 22
        run: pnpm check:coverage
      - name: SC-003 simulation
        if: matrix.node == 22
        run: pnpm bench
      - name: Pack
        if: matrix.node == 22
        run: pnpm pack --pack-destination "$RUNNER_TEMP/pack"
      - name: The package ships the page template
        if: matrix.node == 22
        run: tar -tzf "$RUNNER_TEMP"/pack/*.tgz | grep -x 'package/dist/viewer/report.html'
      - if: matrix.node == 22
        run: pnpm exec publint run "$RUNNER_TEMP"/pack/*.tgz
      # The package is ESM only, so CommonJS resolution is not checked.
      - if: matrix.node == 22
        run: pnpm exec attw "$RUNNER_TEMP"/pack/*.tgz --profile esm-only

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm build
      - name: Swap the example (exit 1 expected, its next variant blocks)
        timeout-minutes: 3
        run: |
          cp -R examples/pogo "$RUNNER_TEMP/pogo"
          cd "$RUNNER_TEMP/pogo"
          set +e
          node "$GITHUB_WORKSPACE/dist/cli.js" swap --from current --to next
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::the example swap exited $code, expected 1"
            exit 1
          fi
      - name: Collect index.html and each comparisons/<comparisonId>/report.html
        run: |
          out="$RUNNER_TEMP/pogo/.model-eval"
          pages="$RUNNER_TEMP/example-pages"
          mkdir -p "$pages"
          cp "$out/index.html" "$pages/index.html"
          # The glob skips `.tmp-` folders, whose names start with a dot.
          for page in "$out"/comparisons/*/report.html; do
            relative="${page#"$out"/}"
            mkdir -p "$pages/$(dirname "$relative")"
            cp "$page" "$pages/$relative"
          done
          find "$pages" -type f
      # The pages of this commit's example, for a reviewer to download and open (002 plan D11).
      - uses: actions/upload-artifact@v7
        with:
          name: example-pages
          path: ${{ runner.temp }}/example-pages
          retention-days: 14
          if-no-files-found: error
      - run: pnpm test:browser --pass-with-no-tests

  python-requirements:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.list.outputs.entries }}
    steps:
      - uses: actions/checkout@v7
      # Pull request: each transport of each SDK at one end of the supported Pythons, httpx on
      # 3.10 (openai 2, anthropic 0) and httpx2 on the newest (openai 3, anthropic 2), and both
      # transports installed together. Otherwise: every file of tests/requirements/ on 3.10 and
      # the newest Python, except openai 1, which cannot build Responses API objects on Python
      # 3.14 and later (it sets an attribute on a typing.Union; openai 2.7.2 fixed it) and runs on
      # 3.13 instead.
      - id: list
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          cd adapters/python/tests/requirements
          if [ "$PULL_REQUEST" = true ]; then
            files='3.10 openai-2
          3.10 anthropic-0
          3.x openai-3
          3.x anthropic-2
          3.x both-transports'
          else
            files=$(for file in *.txt; do
              name=${file%.txt}
              echo "3.10 $name"
              if [ "$name" = openai-1 ]; then echo "3.13 $name"; else echo "3.x $name"; fi
            done)
          fi
          for name in $(echo "$files" | cut -d ' ' -f 2); do
            test -f "$name.txt" || { echo "::error::no tests/requirements/$name.txt"; exit 1; }
          done
          # Each job runs two pytest workers (below), so an anthropic file splits over two jobs
          # and an openai file, with about twice the cases (two APIs), over four
          # (MODEL_EVAL_SHARD, adapters/python/tests/conftest.py).
          entries=$(echo "$files" | while read -r python name; do
            case $name in
              (openai-*) shards=4 ;;
              (anthropic-*) shards=2 ;;
              (*) shards=1 ;;
            esac
            if [ "$shards" = 1 ]; then
              echo "$python $name"
            else
              for i in $(seq "$shards"); do echo "$python $name $i/$shards"; done
            fi
          done)
          echo "$entries"
          json=$(echo "$entries" | jq -Rcn '[inputs | split(" ") | {python: .[0], requirements: .[1], shard: (.[2] // "")}]')
          echo "entries=$json" >> "$GITHUB_OUTPUT"

  python:
    needs: python-requirements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.python-requirements.outputs.entries) }}
    defaults:
      run:
        working-directory: adapters/python
    env:
      MODEL_EVAL_REQUIREMENTS: ${{ matrix.requirements }}
      MODEL_EVAL_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
          cache: pip
          cache-dependency-path: adapters/python/tests/requirements/${{ matrix.requirements }}.txt
      - run: python3 -m pip install -r tests/requirements/${{ matrix.requirements }}.txt
      # Two workers on the runner's four vCPUs: each case starts its own adapter process next
      # to the mock API server, and the scenarios' stream timings need the spare CPU.
      - run: python3 -m pytest -n 2 --junitxml="$RUNNER_TEMP/pytest.xml"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pytest-${{ steps.python.outputs.python-version }}-${{ matrix.requirements }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/pytest.xml
          retention-days: 7
          if-no-files-found: error

  python-scenarios:
    needs: python
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: pytest-*
          path: ${{ runner.temp }}/pytest
      - name: Every scenario with a Python case ran in some entry
        run: python3 scripts/check-python-scenarios.py "$RUNNER_TEMP/pytest"
