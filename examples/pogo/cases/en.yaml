# Synthetic small talk with Pogo in English. Every global rule applies to each case.
cases:
  - id: greet-en
    target: chat
    lang: en
    provenance: synthetic
    input:
      nickname: Sky
      user: hi
      state: { wearing: [scarf] }
    note: A plain greeting. Every global rule applies.

