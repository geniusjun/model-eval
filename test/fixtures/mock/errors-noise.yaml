# The candidate prints a debug line on stdout instead of answering greet-ja-1.
targets:
  - name: chat
    languages: [ko, ja]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, maxConcurrency: 1 }
inputTokens: 400
maxOutputTokens: 256
variants:
  current:
    answer: { '*': "answer to {caseId}" }
  next:
    answer: { '*': "answer to {caseId}" }
    outcomes:
      - { row: noise, probability: 1, caseIds: [greet-ja-1], message: "debug: prompt for {caseId} ready" }
