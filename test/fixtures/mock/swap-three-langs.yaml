# The candidate adds an emoji to every Japanese answer and keeps Korean and English clean.
targets:
  - name: chat
    languages: [ko, ja, en]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, stages: true, postprocess: true, maxConcurrency: 4 }
prompts:
  ko: 이모지를 붙이지 않는다.
  ja: 絵文字を使わない。
  en: Never use emoji.
inputTokens: 400
maxOutputTokens: 256
variants:
  current:
    answer: { ko: "응, {caseId} 알겠어 {repeat}", ja: "はい、{caseId}。{repeat}", en: "Sure, {caseId} {repeat}" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
  next:
    answer: { ko: "응, {caseId} 알겠어 {repeat}", ja: "はい、{caseId}。{repeat}", en: "Sure, {caseId} {repeat}" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
    violations:
      - { text: " 😀", probability: 1, langs: [ja] }
