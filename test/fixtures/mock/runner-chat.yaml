# A chat target in two languages for the runner tests. Every generate request logs the number in flight.
adapter: { name: mock-chat, version: 0.2.0 }
service: { version: 0123456789abcdef0123456789abcdef01234567, dirty: false }
targets:
  - name: chat
    languages: [ko, ja]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, stages: true, postprocess: true, cancel: false, maxConcurrency: 4 }
prompts:
  ko: 이모지를 붙이지 않는다.
  ja: 絵文字を使わない。
inputTokens: 400
maxOutputTokens: 1024
reportInflight: true
variants:
  '*':
    answer: { '*': "answer to {caseId} #{repeat}" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
    modelSnapshot: model-a-2026-01-01
