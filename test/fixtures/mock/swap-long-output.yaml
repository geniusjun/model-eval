# The candidate writes 12,500 output tokens per trial, far more than a first run assumes.
targets:
  - name: chat
    languages: [ko, ja]
capabilities: { render: true, maxConcurrency: 4 }
prompts:
  ko: 짧게 답한다.
  ja: 短く答える。
inputTokens: 1000
variants:
  current:
    answer: { '*': "answer {caseId} {repeat}" }
    usage: { input: 100, cachedInput: 0, cacheWrite: 0, output: 10, reasoning: 0 }
    calls: true
  next:
    answer: { '*': "a much longer answer {caseId} {repeat}" }
    usage: { input: 100, cachedInput: 0, cacheWrite: 0, output: 12500, reasoning: 0 }
    calls: true
