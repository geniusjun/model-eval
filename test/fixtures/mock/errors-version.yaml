# The candidate's process exits on greet-ko-2; a restarted process declares another adapter version.
adapter: { name: mock-chat, version: 0.1.0 }
service: { version: "1111111111111111111111111111111111111111", dirty: false }
restarted:
  adapter: { name: mock-chat, version: 0.2.0 }
targets:
  - name: chat
    languages: [ko, ja]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, maxConcurrency: 1 }
inputTokens: 400
maxOutputTokens: 256
variants:
  current:
    answer: { '*': "answer to {caseId}" }
  next:
    answer: { '*': "answer to {caseId}" }
    outcomes:
      - { row: crash, probability: 1, caseIds: [greet-ko-2] }
