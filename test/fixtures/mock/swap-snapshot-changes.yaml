# The model behind the candidate alias answers with another snapshot on every repeat.
targets:
  - name: chat
    languages: [ko, ja]
capabilities: { render: true, maxConcurrency: 4 }
prompts:
  ko: 짧게 답한다.
  ja: 短く答える。
inputTokens: 400
variants:
  current:
    answer: { '*': "answer {caseId} {repeat}" }
    usage: { input: 40, cachedInput: 360, output: 18 }
    calls: true
    modelSnapshot: model-a-2026-01-01
  next:
    answer: { '*': "answer {caseId} {repeat}" }
    usage: { input: 40, cachedInput: 360, output: 18 }
    calls: true
    modelSnapshot: "model-b-snapshot-{repeat}"
