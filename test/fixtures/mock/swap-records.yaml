# Known per-trial values for the record tests. Every answer carries a phone number that the
# config's redaction rule must remove from every written surface except trials.jsonl.
adapter: { name: mock-records, version: 0.2.0 }
service: { version: "1111111111111111111111111111111111111111", dirty: false }
targets:
  - name: chat
    languages: [ko, ja]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, stages: true, postprocess: true, maxConcurrency: 4 }
prompts:
  ko: 이모지를 붙이지 않는다.
  ja: 絵文字を使わない。
inputTokens: 400
maxOutputTokens: 256
variants:
  current:
    answer: { ko: "응 {caseId} {repeat} 010-1234-5678", ja: "はい {caseId} {repeat} 010-1234-5678" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
    stages: true
    modelSnapshot: model-a-2026-01-01
    latencyMs: 120
  next:
    answer: { ko: "응 {caseId} {repeat} 010-1234-5678", ja: "はい {caseId} {repeat} 010-1234-5678" }
    usage: { input: 50, cachedInput: 350, cacheWrite: 0, output: 30, reasoning: 8 }
    calls: true
    stages: true
    answers: 2
    modelSnapshot: model-b-2026-10-01
    latencyMs: 180
    violations:
      - { text: " 😀", probability: 1, langs: [ja] }
