# The process exits on crash-1; a restarted process exits before it answers initialize.
restarted:
  exit: at-start
targets:
  - name: chat
    inputSchema: { type: object }
capabilities: { maxConcurrency: 2 }
variants:
  '*':
    answer: { '*': 'answer to {caseId}' }
    outcomes:
      - { row: crash, probability: 1, caseIds: [crash-1] }
