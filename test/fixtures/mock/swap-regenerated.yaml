# The service filters every candidate first answer and ships a regenerated one; in Japanese the
# first answer carries an emoji that the regenerated answer does not.
targets:
  - name: chat
    languages: [ko, ja]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, stages: true, postprocess: true, maxConcurrency: 4 }
prompts:
  ko: 이모지를 붙이지 않는다. 반말로 짧게 답한다.
  ja: 日本語だけで話す。絵文字を使わない。
inputTokens: 400
maxOutputTokens: 256
variants:
  current:
    answer: { ko: "응, {caseId} 알겠어 {repeat}", ja: "はい、{caseId}。{repeat}" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
  next:
    answer: { ko: "응, {caseId} 알겠어 {repeat}", ja: "はい、{caseId}。{repeat}" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
    answers: 2
    violations:
      - { text: " 😀", probability: 1, langs: [ja], masked: true }
