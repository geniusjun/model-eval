# The process exits on the case crash-1; held-1 never answers; every other case answers.
targets:
  - name: chat
    inputSchema: { type: object }
capabilities: { maxConcurrency: 2 }
variants:
  '*':
    answer: { '*': 'answer to {caseId}' }
    outcomes:
      - { row: crash, probability: 1, caseIds: [crash-1] }
      - { row: hang, probability: 1, caseIds: [held-1] }
