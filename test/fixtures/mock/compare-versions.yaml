# Both variants answer cleanly; tests change what the adapter declares between runs.
adapter: { name: mock-chat, version: 0.1.0, helper: { language: python, version: 0.1.0 } }
service:
  version: 0123456789abcdef0123456789abcdef01234567
  dirty: false
  treeHash: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
targets:
  - name: chat
    languages: [ko]
    inputSchema: { type: object, required: [user], properties: { user: { type: string } } }
capabilities: { render: true, stages: true, postprocess: true, maxConcurrency: 4 }
prompts:
  ko: 이모지를 붙이지 않는다. 반말로 짧게 답한다.
inputTokens: 400
maxOutputTokens: 256
variants:
  '*':
    answer: { ko: "응, {caseId} 알겠어 {repeat}" }
    usage: { input: 40, cachedInput: 360, cacheWrite: 0, output: 18, reasoning: 0 }
    calls: true
